# Mantener despierto el proyecto de Supabase (OPCIONAL)
#
# El plan gratuito de Supabase pausa el proyecto tras 7 días sin
# actividad. Este flujo hace una lectura mínima cada 3 días para evitarlo.
# Lee la URL y la clave pública del propio config.js: no necesita secretos.
#
# Para DESACTIVARLO (elige una):
#   · GitHub → pestaña Actions → «Mantener Supabase despierto» → botón «…»
#     → Disable workflow. Se puede volver a activar igual.
#   · O borra este fichero del repositorio.
#
# Para probarlo a mano: Actions → «Mantener Supabase despierto» → Run workflow.

name: Mantener Supabase despierto

on:
  schedule:
    - cron: "17 7 */3 * *"   # Cada 3 días, a las 7:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Hacer una lectura en Supabase
        run: |
          set -eu
          if [ ! -f config.js ]; then
            echo "No hay config.js en el repositorio. Nada que hacer."
            exit 1
          fi
          URL=$(sed -n "s/.*SUPABASE_URL *= *['\"]\([^'\"]*\)['\"].*/\1/p" config.js)
          CLAVE=$(sed -n "s/.*SUPABASE_ANON_KEY *= *['\"]\([^'\"]*\)['\"].*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then
            echo "No se han encontrado SUPABASE_URL o SUPABASE_ANON_KEY en config.js."
            exit 1
          fi
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $CLAVE" \
            "$URL/rest/v1/familias?select=id&limit=1")
          echo "Respuesta de Supabase: $CODIGO"
          [ "$CODIGO" = "200" ]
